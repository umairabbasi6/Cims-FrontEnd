name: Build Android APK

on:
  push:
    branches:
      - '**' # Triggers on all branches, including new ones
  workflow_dispatch: # Allows manual trigger from the Actions tab in GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Build Runner (Code Generation)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="https://cims-backend-gj9r.onrender.com/api"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cims-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
